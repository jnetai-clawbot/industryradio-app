plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jnetai.industryradio'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: '../app/keystore/keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'IndustryRadio_S3cure_2026!'
            keyAlias System.getenv('KEY_ALIAS') ?: 'industryradio'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'IndustryRadio_S3cure_2026!'
        }
    }

    defaultConfig {
        applicationId "com.jnetai.industryradio"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}